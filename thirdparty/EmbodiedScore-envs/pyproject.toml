[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodiedscore-envs"
version = "0.2.0"
description = "The habitat navigation lines of EmbodiedScore-envs used by NavHarness (GOAT-Bench, IR2R-CE, VLN-CE R2R) behind Gymnasium 1.3 on one frozen habitat-sim 0.3.3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gymnasium>=1.3",
    "numpy>=1.24,<2",
    "numpy-quaternion",
    "scipy",
    "fastdtw",
]
# habitat-sim is not a pip dependency: build it from
# https://github.com/Embodied-Agent-Squad/EmbodiedScore-habitat (BUILD.md).

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["embodiedscore_envs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
